
name: Terraform Destroy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    name: Destroy AWS Infrastructure
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_REGION: "eu-west-2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init -input=false

      - name: Verify Terraform state
        run: |
          $state = @(terraform state list)

          if ($LASTEXITCODE -ne 0) {
            throw "Cannot access Terraform state. Destroy cancelled."
          }

          if ($state.Count -eq 0) {
            throw "Terraform state is empty. Destroy cancelled to prevent accidental operations."
          }

          Write-Host "Resources found in Terraform state:"
          $state | ForEach-Object { Write-Host $_ }

      - name: Create destroy plan
        run: terraform plan -destroy -input=false -lock-timeout=5m -out=destroy.tfplan

      - name: Verify destroy plan
        run: |
          $plan = terraform show -json destroy.tfplan | ConvertFrom-Json

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read destroy plan."
          }

          $changes = @($plan.resource_changes)

          $unexpected = @($changes | Where-Object {
            $_.change.actions -contains "create" -or
            $_.change.actions -contains "update"
          })

          if ($unexpected.Count -gt 0) {
            throw "Unexpected resource creation or updates detected. Destroy cancelled."
          }

          $deletions = @($changes | Where-Object {
            $_.change.actions -contains "delete"
          })

          if ($deletions.Count -eq 0) {
            throw "No resources are scheduled for destruction. Destroy cancelled."
          }

          Write-Host "Resources scheduled for deletion:"
          $deletions | ForEach-Object {
            Write-Host $_.address
          }

      - name: Show destroy plan
        run: terraform show -no-color destroy.tfplan

      - name: Destroy infrastructure
        run: terraform apply -input=false -auto-approve destroy.tfplan
