
name: Terraform deployment

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/terraform-destroy.yml'

  pull_request:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/terraform-destroy.yml'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform on Windows
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_REGION: "eu-west-2"

    steps:
      # 1. Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      # 3. Configure AWS authentication using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 4. Verify AWS account
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 5. Check Terraform version
      - name: Check Terraform version
        run: terraform version

      # 6. Check formatting
      - name: Terraform Format
        run: terraform fmt -check -recursive

      # 7. Initialize Terraform
      - name: Terraform Init
        run: terraform init -input=false

      # 8. Validate configuration
      - name: Terraform Validate
        run: terraform validate

      # 9. Generate execution plan
      - name: Terraform Plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      # 10. Display execution plan
      - name: Show Terraform Plan
        run: terraform show -no-color tfplan

      # 11. Apply changes only on main branch
      - name: Terraform Apply
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan